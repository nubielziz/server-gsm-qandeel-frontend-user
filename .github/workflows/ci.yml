# Continuous integration: the website's own checks on every push to main and on every pull request.
# No job reads a secret, so a pull request from a fork runs the same jobs. The production server deploys a commit of main only
# after this workflow succeeded for it (backend repository: deploy/cd/auto-deploy.sh, docs/OPERATIONS.md section 8).
# Actions are pinned to a commit; the comment names the release that commit is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install the dependencies
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint and English only
        run: npm run lint
      - name: Unit tests
        run: npm test
      # No build here: it reads the public catalog from a running API (docs/DEPLOY.md). The server builds the image when it deploys
      # and keeps the previous one when that build fails. The browser tests need the isolated backend and run on a developer's machine.

  # lib/api/schema.gen.ts is generated from the backend's contract (npm run gen:api). This job fails when the file is behind, so a
  # change of the contract enters the website on purpose: generate the file again, and the type check shows what the change touches.
  # The contract it compares with is the one of the backend branch named in ci/backend-ref (one line). It is `main` and stays `main`;
  # a pull request that depends on a change of the backend names that branch there, so the two pull requests prove each other before
  # either reaches main. A push to main with any other ref fails the job: set the file back to `main` before the merge.
  api-types:
    name: API types match the backend's contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: storefront
          persist-credentials: false
      - name: Read the backend ref
        id: backend-ref
        working-directory: storefront
        run: |
          set -euo pipefail
          if [ ! -f ci/backend-ref ]; then
            echo "::error file=ci/backend-ref::The file is missing. It holds one line: the backend branch to compare with (main)."
            exit 1
          fi
          ref="$(tr -d '\r' < ci/backend-ref)"
          if ! [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$ref" == *..* ]]; then
            echo "::error file=ci/backend-ref::The file must hold exactly one branch name of the backend repository, with no spaces."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Refuse another backend ref on a push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.backend-ref.outputs.ref != 'main'
        env:
          BACKEND_REF: ${{ steps.backend-ref.outputs.ref }}
        run: |
          echo "::error file=ci/backend-ref::A push to main compares with the backend's main, not with '$BACKEND_REF'. Set the file back to main."
          exit 1
      - name: Check out the backend next to it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nubielziz/server-gsm-qandeel-backend
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Compare the generated types with the contract
        working-directory: storefront
        run: node scripts/gen-api-types.mjs --check
